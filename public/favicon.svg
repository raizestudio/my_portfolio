<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fond Blanc Arrondi (Style Apple Squircle) -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Subtile bordure d'ombrage pour faire ressortir le fond blanc sur navigateur clair/sombre -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Initiales JP en Slate Sombre (#0f172a) -->
  <text
    x="50%"
    y="53%"
    dominant-baseline="central"
    text-anchor="middle"
    fill="#0f172a"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="250"
    letter-spacing="-12">JP</text>
</svg>
